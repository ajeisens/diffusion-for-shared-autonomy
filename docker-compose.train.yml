version: '3.8'

services:
  # Generate the sweep .jsonl (run once before training)
  sweep-gen:
    build:
      context: .
      dockerfile: Dockerfile.train
    volumes:
      - .:/app
    command: python diffusha/config/sweep/sweep-kto-lander.py

  # Evaluation service — run eval_kto.py against trained checkpoints
  eval:
    build:
      context: .
      dockerfile: Dockerfile.train
    environment:
      - WANDB_MODE=disabled
    volumes:
      - .:/app
      - ./models:/data/ddpm
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    command: >
      python -m diffusha.diffusion.evaluation.eval_kto
        --teleop_model    /data/ddpm/dummy/svw3msaq/step_00099999.pt
        --heuristic_model /data/ddpm/dummy/yfr213ba/step_00099999.pt
        --kto_model       /data/ddpm/dummy/ekbb5v8l/step_00099999.pt
        --n_episodes 100
        --output /app/results_kto.json
        --verbose

  # Generic training service — use -l flag to select run
  # Run 0: teleop BC
  # Run 1: heuristic BC
  # Run 2: KTO BC
  # Run 3: collision-conditioned (teleop + CFG quality label)
  train:
    build:
      context: .
      dockerfile: Dockerfile.train
    environment:
      - WANDB_MODE=disabled
    volumes:
      - .:/app
      - ./demo/interactive/recorded_episodes:/app/demo/interactive/recorded_episodes
      - ./models:/data/ddpm
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    # Override command with: docker compose -f docker-compose.train.yml run --rm train python -m diffusha.diffusion.train ... -l N
    command: >
      bash -c "
        python -m diffusha.diffusion.train diffusha/config/sweep/sweep-kto-lander.jsonl -l 0 &&
        python -m diffusha.diffusion.train diffusha/config/sweep/sweep-kto-lander.jsonl -l 1 &&
        python -m diffusha.diffusion.train diffusha/config/sweep/sweep-kto-lander.jsonl -l 2 &&
        python -m diffusha.diffusion.train diffusha/config/sweep/sweep-kto-lander.jsonl -l 3
      "
