version: '3.8'

services:
  # Generate the sweep .jsonl (run once before training)
  sweep-gen:
    build:
      context: .
      dockerfile: Dockerfile.train
    volumes:
      - .:/app
    command: python diffusha/config/sweep/sweep-kto-lander.py

  # Evaluation service — run eval_kto.py against trained checkpoints
  eval:
    build:
      context: .
      dockerfile: Dockerfile.train
    environment:
      - WANDB_MODE=disabled
    volumes:
      - .:/app
      - ./models:/data/ddpm
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    command: >
      python -m diffusha.diffusion.evaluation.eval_kto
        --kto_model       /data/ddpm/diffusha/<run_id>/step_00099999.pt
        --horizon 16
        --exec_horizon 4
        --n_episodes 100
        --output /app/results_kto.json
        --verbose

  # Generic training service — use -l flag to select run
  # Run 0: heuristic BC           (no latency augmentation)
  # Run 1: KTO BC                 (no latency augmentation)
  # Run 2: KTO BC + delay~U[0,7] (robust latency-augmented — recommended)
  # Run 3: KTO BC + delay=7      (fixed worst-case latency stress-test)
  train:
    build:
      context: .
      dockerfile: Dockerfile.train
    environment:
      - WANDB_MODE=disabled
    volumes:
      - .:/app
      - ./demo/interactive/recorded_episodes:/app/demo/interactive/recorded_episodes
      - ./models:/data/ddpm
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    # Override command with: docker compose -f docker-compose.train.yml run --rm train python -m diffusha.diffusion.train ... -l N
    command: >
      bash -c "
        python -m diffusha.diffusion.train diffusha/config/sweep/sweep-kto-lander.jsonl -l 0 &&
        python -m diffusha.diffusion.train diffusha/config/sweep/sweep-kto-lander.jsonl -l 1 &&
        python -m diffusha.diffusion.train diffusha/config/sweep/sweep-kto-lander.jsonl -l 2 &&
        python -m diffusha.diffusion.train diffusha/config/sweep/sweep-kto-lander.jsonl -l 3
      "

  # ── Latency experiment evaluation ──────────────────────────────────────────
  # Evaluate the async latency sweep against a trained checkpoint.
  # Set CHECKPOINT to the .pt file to evaluate.
  #
  # Async sweep, no compensation (baseline broken system):
  #   docker compose -f docker-compose.train.yml run --rm latency-eval
  #
  # Override checkpoint:
  #   CHECKPOINT=models/diffusha/<run_id>/step_00099999.pt \
  #   docker compose -f docker-compose.train.yml run --rm latency-eval
  latency-eval:
    build:
      context: .
      dockerfile: Dockerfile.train
    environment:
      - WANDB_MODE=disabled
      - CHECKPOINT=${CHECKPOINT:-models/dummy/tdf9n8qj/step_00099999.pt}
    volumes:
      - .:/app
      - ./models:/data/ddpm
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    command: >
      bash -c "
        python -m demo.latency.eval_latency
          --checkpoint $$CHECKPOINT
          --sweep --async-inference
          -n 50
          --out /app/results_latency_async.json
      "

  # Async sweep WITH Fix 2 chunk-plan-informed predictive compensation:
  #   docker compose -f docker-compose.train.yml run --rm latency-eval-predictive
  latency-eval-predictive:
    build:
      context: .
      dockerfile: Dockerfile.train
    environment:
      - WANDB_MODE=disabled
      - CHECKPOINT=${CHECKPOINT:-models/dummy/tdf9n8qj/step_00099999.pt}
    volumes:
      - .:/app
      - ./models:/data/ddpm
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    command: >
      bash -c "
        python -m demo.latency.eval_latency
          --checkpoint $$CHECKPOINT
          --sweep --async-inference --predictive
          -n 50
          --out /app/results_latency_async_predictive.json
      "
